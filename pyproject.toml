[project]
name = "napari-molseeq"
dynamic = ["version"]
description = "A Napari plugin for extracting single molecule sequences from single/multi-channel SMLM microscopy data."
readme = "README.md"
license = {file = "LICENSE"}
authors = [
  {name = "Piers Turner"},
  {email = "piers.turner@physics.ox.ac.uk"},
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: napari",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Image Processing",
]
requires-python = ">=3.14"
dependencies = [
    "napari[pyqt6]>=0.9.2",
    "numpy",
    "magicgui",
    "qtpy",
    "molcore[localisation,tracking,clustering] @ git+https://github.com/piedrro/molcore.git@6fcf9dee9b8e7423912695b7bd4ff3fb61c07766",
    "scipy",
    "pyqtgraph",
    "picassosr>=0.7.3",
    "pandas",
    "matplotlib >= 3.7.0",
    "opencv-python",
    "tqdm",
    "originpro",
    "trackpy",
    "shapely",
    "astropy",
    "mat4py",
    "h5py",
    "numba",
    "pillow",
    "psutil",
    "pyyaml",
    "scikit-learn",
    "tifffile",
]

[project.optional-dependencies]
testing = [
    "tox",
    "pytest",  # https://docs.pytest.org/en/latest/contents.html
    "pytest-cov",  # https://pytest-cov.readthedocs.io/en/latest/
    "pytest-qt",  # https://pytest-qt.readthedocs.io/en/latest/
    "napari",
    "pyqt6",
]

[project.scripts]
molseeq = "molseeq.launcher:main"

[project.entry-points."napari.manifest"]
napari-molseeq = "molseeq:napari.yaml"

[project.urls]
"Bug Tracker" = "https://github.com/piedrro/napari-molseeq/issues"
"Documentation" = "https://github.com/piedrro/napari-molseeq#README.md"
"Source Code" = "https://github.com/piedrro/napari-molseeq"
"User Support" = "https://github.com/piedrro/napari-molseeq/issues"

[build-system]
requires = ["setuptools>=42.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "molseeq.__init__.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml","*.dll"]

[tool.black]
line-length = 79
target-version = ['py314']

[tool.ruff]
target-version = "py314"
line-length = 79
lint.select = [
    "E", "F", "W", #flake8
    "UP", # pyupgrade
    "I", # isort
    "BLE", # flake8-blind-exception
    "B", # flake8-bugbear
    "A", # flake8-builtins
    "C4", # flake8-comprehensions
    "ISC", # flake8-implicit-str-concat
    "G", # flake8-logging-format
    "PIE", # flake8-pie
    "SIM", # flake8-simplify
]
lint.ignore = [
    "E501", # line too long. let black handle this
    "UP006", "UP007", # type annotation. As using magicgui require runtime type annotation then we disable this.
    "SIM117", # flake8-simplify - some of merged with statements are not looking great with black, reanble after drop python 3.9
]

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".mypy_cache",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "*vendored*",
    "*_vendor*",
]


[dependency-groups]
dev = [
    "ipython",
    "pytest",
    "pytest-cov",
    "pytest-qt",
    "twine",
]
